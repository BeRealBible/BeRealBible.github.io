'use strict';const M=JSON.parse(document.querySelector('#edition').textContent);document.querySelector('#edition').remove();const $=id=>document.getElementById(id),svgNS='http://www.w3.org/2000/svg',svg=t=>document.createElementNS(svgNS,t);

function valid(k){return anchors.has(k)||(/^\d{1,4}$/.test(k)&&+k>0&&+k<=M.count)}
function datum(){let k=location.hash.slice(1);if(valid(k))return k;const q=new URLSearchParams(location.search),book=M.books.find(b=>b.name===q.get('book'));if(book){const sought=book.code+'.'+Number(q.get('ch'));if(anchors.has(sought))return sought}const last=getSaved();return valid(last)?last:'GEN.1'}

async function pack(k){if(!M.packs[k])return {};if(!cache.has(k)){const p=fetch('./paper-pages/'+M.packs[k]).then(r=>{if(!r.ok)throw Error('无法载入印页');return r.json()}).catch(e=>{cache.delete(k);throw e});cache.set(k,p);if(cache.size>3)cache.delete(cache.keys().next().value)}return cache.get(k)}

 }catch(e){if(seq!==epoch)return;const box=document.createElement('div');box.className='empty';const msg=document.createElement('p');msg.textContent='当前书页没有加载成功。请检查网络后重试，或返回原阅读器。';const btn=document.createElement('button');btn.textContent='重新载入这一跨页';btn.onclick=show;box.append(msg,btn);main.replaceChildren(box);delete main.dataset.ready;main.setAttribute('aria-busy','false');$('location').textContent='未能打开书页'}}
$('books').onchange=()=>options($('books').value,1);$('open').onclick=()=>go($('books').value+'.'+$('chapters').value);$('prev').onclick=()=>go(Math.max(1,currentLeft-2));$('next').onclick=()=>go(Math.min(M.count,currentLeft+2));$('zoom').onclick=()=>{const yes=$('pages').classList.toggle('enlarged');$('zoom').setAttribute('aria-pressed',String(yes));$('zoom').textContent=yes?'适合屏幕':'放大';if(!yes)$('viewport').scrollLeft=0};
